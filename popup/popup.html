<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Telegram Media Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <header class="header">
      <img class="logo" src="../icons/icon48.png" alt="" width="28" height="28">
      <div class="title-block">
        <h1 class="title" data-i18n="extName"></h1>
        <p class="version" id="version"></p>
      </div>
    </header>

    <div class="status" id="status">
      <span class="status-dot" id="statusDot"></span>
      <span class="status-text" id="statusText"></span>
    </div>

    <label class="toggle-row" for="enabledToggle">
      <span class="toggle-label" data-i18n="popupToggle"></span>
      <span class="switch">
        <input type="checkbox" id="enabledToggle" checked>
        <span class="slider"></span>
      </span>
    </label>

    <button class="open-telegram" id="openTelegram" data-i18n="popupOpenTelegram"></button>

    <p class="hint" data-i18n="popupHint"></p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
